name: Public client checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify public Megolm test encoding
        working-directory: scripts/public-megolm-fixture
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Verify public design import and producer pin
        run: |
          python3 scripts/import-design-exports --verify
          python3 -m unittest discover -s tests -p test_import_design_exports.py
      - name: Verify public push fixtures
        run: |
          python3 scripts/generate-native-push-fixtures.py --check
          python3 -m unittest discover -s tests -p test_native_push_projection.py
      - name: Verify public Apple purchase contract text
        run: |
          python3 scripts/verify-native-purchase-contract.py
          python3 -m unittest discover -s tests -p test_native_purchase_contract.py
      - name: Parse and resolve the client package
        working-directory: ios
        run: |
          swift package dump-package > /tmp/atum-package.json
          swift package resolve
      - name: Parse native project
        run: plutil -lint ios/AtumMobile.xcodeproj/project.pbxproj

# Artifact allowlist is empty: no logs, captures, packages or release artifacts uploaded.
# No shared caches or release/signing authority in public CI.

  app-tests:
    name: App target and AppTests
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select a standard hosted iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          destination=$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], text=True
          ))
          candidates = [
              device
              for devices in data['devices'].values()
              for device in devices
              if device['name'].startswith('iPhone') and device.get('isAvailable', True)
          ]
          if not candidates:
              raise SystemExit('standard hosted image has no available iPhone simulator')
          print(f"platform=iOS Simulator,id={candidates[-1]['udid']}")
          PY
          )
          echo "IOS_DESTINATION=$destination" >> "$GITHUB_ENV"
      - name: Build app and tests without signing
        env:
          DERIVED_DATA: ${{ runner.temp }}/atum-mobile-derived-data
          SOURCE_PACKAGES: ${{ runner.temp }}/atum-mobile-source-packages
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/AtumMobile.xcodeproj \
            -scheme AtumMobile \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -destination-timeout 60 \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disableAutomaticPackageResolution \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing
      - name: Run AppTests
        env:
          DERIVED_DATA: ${{ runner.temp }}/atum-mobile-derived-data
          SOURCE_PACKAGES: ${{ runner.temp }}/atum-mobile-source-packages
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/AtumMobile.xcodeproj \
            -scheme AtumMobile \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -destination-timeout 60 \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:AtumMobileTests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building
      - name: Build Release for device without signing
        # TestFlight archives use Release; prove it compiles without Debug-only
        # sources and ships no scenario fixtures.
        env:
          RELEASE_DERIVED_DATA: ${{ runner.temp }}/atum-mobile-release-derived-data
          SOURCE_PACKAGES: ${{ runner.temp }}/atum-mobile-source-packages
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/AtumMobile.xcodeproj \
            -scheme AtumMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RELEASE_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -disableAutomaticPackageResolution \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
          app=$(find "$RELEASE_DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no Release .app produced"; exit 1; }
          if find "$app" -ipath '*fixtures*' | grep -q .; then
            echo "Release bundle contains fixtures:"; find "$app" -ipath '*fixtures*' | head; exit 1
          fi
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "app privacy manifest missing"; exit 1; }
      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown all || true

  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: swift --version
      - run: swift test --package-path ios -j 2

  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_import_design_exports.py -v
      - run: python3 -m unittest discover -s tests -p test_native_push_projection.py -v
      - run: python3 scripts/import-design-exports --verify
      - run: python3 scripts/generate-native-push-fixtures.py --check
      - run: python3 -m unittest discover -s tests -p test_native_purchase_contract.py -v
      - run: python3 scripts/verify-native-purchase-contract.py
